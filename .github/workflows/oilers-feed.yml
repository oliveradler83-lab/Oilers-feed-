name: Oilers Feed

on:
  schedule:
    - cron: "17 * * * *"   # stündlich (GitHub verzögert/überspringt Läufe oft, daher dichter getaktet)
  workflow_dispatch:
  push:
    branches: [main]
    paths:   # nur bei Code-Änderungen, nicht bei den Posts des Bots
      - "docs/index.html"
      - "generate.py"
      - "config.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: oilers-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Posts erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py
      - name: Posts speichern (damit Duplikate vermieden werden)
        run: |
          git config user.name "oilers-bot"
          git config user.email "oilers-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Oilers-Feed: neue Posts" && git pull --rebase -X theirs origin main && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:   # eigener Job: zuverlässiger als Upload und Deploy im selben Job
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
