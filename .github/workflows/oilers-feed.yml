name: Oilers Feed

on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden
  workflow_dispatch:
  push:
    branches: [main]
    paths:   # nur bei Code-Änderungen, nicht bei den Posts des Bots
      - "docs/index.html"
      - "generate.py"
      - "config.json"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oilers-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Posts erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py
      - name: Posts speichern (damit Duplikate vermieden werden)
        run: |
          git config user.name "oilers-bot"
          git config user.email "oilers-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Oilers-Feed: neue Posts" && git pull --rebase -X theirs origin main && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
