<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oilers Feed</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#111; --muted:#667; --accent:#ff4c00; --blue:#041e42; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10131a; --card:#1a1f2b; --text:#eee; --muted:#9aa; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,sans-serif; }
  header { background:var(--blue); color:#fff; padding:16px; position:sticky; top:0; }
  header h1 { margin:0; font-size:20px; } header h1 span { color:var(--accent); }
  main { padding:12px 16px; max-width:600px; margin:auto; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 1px 3px #0002; }
  .card.done { opacity:.5; }
  .tag { font-size:12px; color:var(--muted); }
  .badge { background:var(--accent); color:#fff; border-radius:6px; padding:1px 6px; margin-right:6px; font-weight:700; }
  .card img { max-width:100%; max-height:260px; display:block; margin:8px 0; border-radius:8px; }
  .text { white-space:pre-wrap; margin:8px 0 12px; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 16px; cursor:pointer; }
  .share { background:#25d366; color:#fff; font-weight:600; }
  .copy { background:transparent; color:var(--muted); }
  .post { background:#25d366; color:#fff; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header .copy { display:block; font-size:13px; text-decoration:underline; }
  #toast { position:fixed; left:16px; right:16px; bottom:16px; background:#111c; color:#fff; padding:12px 14px; border-radius:10px; display:none; z-index:9; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header><h1>🏒 Oilers <span>Feed</span></h1><div style="display:flex;gap:16px;margin-top:4px"><button id="refresh" class="copy" style="color:#fff;padding:4px 0">🔄 Aktualisieren</button><button id="chan" class="copy" style="color:#fff;padding:4px 0">Kanal-Link festlegen</button></div></header>
<div id="toast"></div>
<main id="list"><p class="empty">Lade …</p></main>
<script>
const VERSION = "v6";   // bei Änderungen an dieser Seite hochzählen: Handys laden sich dann selbst neu
async function checkVersion() {
  try {
    const t = await (await fetch("index.html?v=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const VERSION = "([^"]+)"/);
    if (m && m[1] !== VERSION) location.reload();
  } catch (e) {}
}
const done = new Set(JSON.parse(localStorage.getItem("done") || "[]"));
const list = document.getElementById("list");

function markDone(id, card) {
  done.add(id);
  localStorage.setItem("done", JSON.stringify([...done]));
  card.classList.add("done");
  const nb = card.querySelector(".badge"); if (nb) nb.remove();
}

function channelUrl() { try { return localStorage.getItem("channel") || ""; } catch (e) { return ""; } }
function updateChan() { document.getElementById("chan").textContent = channelUrl() ? "Kanal-Link ändern" : "Kanal-Link festlegen"; }
document.getElementById("chan").onclick = () => {
  const v = prompt("Link deines WhatsApp-Kanals (WhatsApp → Kanal → Info → Link teilen), z. B. https://whatsapp.com/channel/…", channelUrl());
  if (v !== null) { try { localStorage.setItem("channel", v.trim()); } catch (e) {} updateChan(); }
};
updateChan();

function toast(msg, ms) {
  const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms || 6000);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {  // Fallback für Browser ohne Clipboard-API
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

async function postToChannel(p, card) {
  if (!(await copyText(p.text))) { prompt("Kopieren nicht möglich – bitte diesen Text selbst kopieren:", p.text); return; }
  markDone(p.id, card);
  const url = channelUrl();
  if (!url) { toast("Text kopiert ✓ Öffne jetzt deinen Kanal in WhatsApp und füge ihn ins Textfeld ein. (Oben „Kanal-Link festlegen“ spart dir das Öffnen.)", 10000); return; }
  toast("Text kopiert ✓ – Kanal wird geöffnet. Dort ins Textfeld tippen und „Einfügen“ wählen.", 8000);
  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.append(a); setTimeout(() => { a.click(); a.remove(); }, 700);
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

async function saveImage(p, ev) {
  if (isIOS) {  // iOS: Teilen-Menü bietet „Bild sichern“
    ev.preventDefault();
    try {
      const blob = await (await fetch(p.image)).blob();
      const file = new File([blob], "oilers.png", { type: blob.type || "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e.name === "AbortError") return; }
    window.open(p.image, "_blank"); toast("Bild gedrückt halten → „Zu Fotos hinzufügen“.", 8000);
  } else { toast("Bild wird heruntergeladen – danach im Kanal über die Büroklammer anhängen.", 8000); }
}

async function share(p, card) {
  const data = { text: p.text };
  try {
    if (p.image) {
      const blob = await (await fetch(p.image)).blob();
      const file = new File([blob], "oilers.png", { type: blob.type || "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file];
    }
  } catch (e) {}
  try {
    if (!navigator.share) throw new Error("no share");
    await navigator.share(data);
    markDone(p.id, card);
  } catch (e) {
    if (e.name !== "AbortError") { await navigator.clipboard.writeText(p.text); alert("Text kopiert – bitte in WhatsApp einfügen."); }
  }
}

let lastSig = "";
function load(manual) {
  return fetch("posts.json?" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(posts => {
  const sig = posts.map(p => p.id).join(",");
  if (!manual && sig === lastSig) return;   // nichts Neues: Liste nicht neu aufbauen
  if (manual && sig === lastSig) toast("Schon aktuell ✓", 2500);
  else if (manual) toast("Neue Posts geladen ✓", 2500);
  lastSig = sig;
  list.innerHTML = posts.length ? "" : '<p class="empty">Noch keine Posts.</p>';
  for (const p of posts) {
    const card = document.createElement("div");
    card.className = "card" + (done.has(p.id) ? " done" : "");
    const tag = document.createElement("div"); tag.className = "tag";
    if (!done.has(p.id)) { const nb = document.createElement("span"); nb.className = "badge"; nb.textContent = "NEU"; tag.append(nb); }
    tag.append(p.type + " · " + new Date(p.created).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }));
    card.append(tag);
    if (p.image) { const i = document.createElement("img"); i.src = p.image; card.append(i); }
    const t = document.createElement("div"); t.className = "text"; t.textContent = p.text; card.append(t);
    const row = document.createElement("div"); row.className = "row";
    const b = document.createElement("button"); b.className = "post"; b.textContent = "📢 In Kanal posten";
    b.onclick = () => postToChannel(p, card);
    row.append(b);
    if (p.image) {
      const im = document.createElement("a"); im.className = "copy"; im.textContent = "🖼️ Bild speichern";
      im.href = p.image; im.download = "oilers.png"; im.style.cssText = "padding:10px 16px;color:var(--muted);text-decoration:none";
      im.onclick = (ev) => saveImage(p, ev); row.append(im);
    }
    const c = document.createElement("button"); c.className = "copy"; c.textContent = "Teilen (Chat/Status)";
    c.onclick = () => share(p, card); row.append(c);
    card.append(row);
    if (p.answer) {
      const r = document.createElement("button"); r.className = "copy"; r.textContent = "Auflösung zeigen";
      r.onclick = () => {
        r.remove();
        const a = document.createElement("div"); a.className = "text"; a.textContent = p.answer;
        const sb = document.createElement("button"); sb.className = "post"; sb.textContent = "📢 Auflösung in Kanal posten";
        sb.onclick = () => postToChannel({ id: p.id + "-a", text: p.answer, image: null }, card);
        card.append(a, sb);
      };
      card.append(r);
    }
    list.append(card);
  }
  }).catch(() => { if (!lastSig) list.innerHTML = '<p class="empty">Posts konnten nicht geladen werden.</p>'; });
}
load();
// automatisch aktualisieren: beim Zurückkehren in die App und alle 5 Minuten
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkVersion(); load(); } });
setInterval(() => { if (document.visibilityState === "visible") { checkVersion(); load(); } }, 5 * 60 * 1000);
checkVersion();
document.getElementById("refresh").onclick = () => load(true);
</script>
</body>
</html>
